name: Publish Spanish learning website
on:
  push:
    branches: [spanish-learning-site]
    paths: ['spanish/**', '.github/workflows/spanish-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: spanish-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify public artifact
        run: |
          test -s spanish/index.html
          test ! -e spanish/assets/gramatica-basica.pdf
          test ! -e spanish/assets/book-pages
          mkdir -p public
          cp -r spanish public/spanish
          cp spanish/index.html public/index.html
          cp -r spanish/assets public/assets
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
